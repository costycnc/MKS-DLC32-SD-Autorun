name: PlatformIO CI

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-24.04 

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio

    - name: Run PlatformIO Build
      # Si sposta nella cartella Firmware dove risiede il file platformio.ini
      working-directory: Firmware
      run: pio run

    - name: Install esptool
      run: pip install esptool

    - name: Merge Full 8MB Firmware
      # Eseguiamo il merge dentro la cartella Firmware dove PlatformIO ha generato i file
      working-directory: Firmware
      run: |
        # Trova la cartella di build (es. .pio/build/esp32dev)
        BUILD_DIR=$(find .pio/build -maxdepth 1 -type d | tail -n 1)
        echo "Uso la directory di build: $BUILD_DIR"
        
        # Esegui il merge dei 3 file in uno da 8MB
        esptool.py --chip esp32 merge_bin \
          -o firmware_full_8mb.bin \
          --flash_mode dio --flash_freq 40m --flash_size 8MB \
          --fill-flash-size 8MB \
          0x1000 $BUILD_DIR/bootloader.bin \
          0x8000 $BUILD_DIR/partitions.bin \
          0x10000 $BUILD_DIR/firmware.bin

    - name: Upload Firmware Binary
      uses: actions/upload-artifact@v4
      with:
        name: MKS-DLC32-Firmware-Full
        # Carica il file appena creato
        path: Firmware/firmware_full_8mb.bin
